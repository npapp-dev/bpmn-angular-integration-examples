<div class="studio-shell" [class.panel-open]="propertiesOpen">
  <!-- Toolbar -->
  <app-diagram-toolbar
    #diagramToolbar
    [diagramName]="getDiagramName()"
    [hasUnsavedChanges]="hasUnsavedChanges()"
    [isReadonly]="isReadonly()"
    [customActions]="getCustomToolbarActions()"
    [canUndo]="canUndo"
    [canRedo]="canRedo"
    [propertiesOpen]="propertiesOpen"
    (actionClicked)="onToolbarAction($event)"
    (importRequested)="onImportRequested()"
    (exportXmlRequested)="onExportXmlRequested()"
    (exportSvgRequested)="onExportSvgRequested()"
    (resetRequested)="onResetRequested()"
    (backupRequested)="onBackupRequested()"
    (zoomToFitRequested)="onZoomToFitRequested()"
    (zoomInRequested)="onZoomInRequested()"
    (zoomOutRequested)="onZoomOutRequested()"
    (undoRequested)="onUndoRequested()"
    (redoRequested)="onRedoRequested()"
    (togglePropertiesRequested)="togglePropertiesPanel()">
  </app-diagram-toolbar>

  <!-- Workspace: canvas + properties drawer -->
  <div class="studio-main">
    <app-diagram-editor
      #diagramEditor
      [readonly]="isReadonly()"
      (ready)="onEditorReady()"
      (error)="onEditorError($event)"
      class="canvas-pane">
    </app-diagram-editor>

    <!-- Mobile-only: floating properties toggle -->
    <button
      type="button"
      class="properties-fab"
      (click)="togglePropertiesPanel()"
      [attr.aria-expanded]="propertiesOpen"
      aria-controls="properties-drawer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line>
        <line x1="17" y1="16" x2="23" y2="16"></line>
      </svg>
      <span>Properties</span>
    </button>

    <aside class="properties-drawer" id="properties-drawer" [attr.aria-hidden]="!propertiesOpen">
      <button
        type="button"
        class="drawer-handle"
        (click)="togglePropertiesPanel()"
        aria-label="Close properties panel">
        <span class="drawer-grip" aria-hidden="true"></span>
      </button>
      <app-properties-panel
        #propertiesPanel
        (propertyChanged)="onPropertyChange($event)"
        class="properties-pane">
      </app-properties-panel>
    </aside>
  </div>

  <!-- Status bar -->
  <app-diagram-status
    #diagramStatus
    [showDetails]="true"
    [showValidation]="true"
    [showZoom]="true"
    [showSelection]="true"
    class="status-pane">
  </app-diagram-status>

  <!-- Loading overlay -->
  @if (isLoading) {
    <div class="loading-overlay" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>Preparing workspace…</span>
      </div>
    </div>
  }
</div>
