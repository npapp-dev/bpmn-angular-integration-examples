<div class="diagram-editor">
  <div
    #diagramContainer
    class="diagram-container"
    [class.readonly]="readonly"
  ></div>

  <!-- Loading indicator -->
  @if (!isReady()) {
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      <span>Loading diagram...</span>
    </div>
  }
</div>
